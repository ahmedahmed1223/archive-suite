name: Docker

on:
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "archive-next/**"
      - "archive-laravel/**"
      - "scripts/**"
      - "infra/ocr-service/**"
      - "infra/platform/**"
      - "infra/offline/**"
      - "infra/k8s/**"
      - "infra/docker-compose.yml"
      - "infra/docker-compose.laravel-next.yml"
      - "infra/deploy/Caddyfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
  push:
    branches:
      - master
      - main
  # Tag pushes are handled by release.yml (full verification gate before
  # publish). This workflow only builds for PR/branch validation, plus a
  # manual escape hatch below.
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_IMAGE: ghcr.io/${{ github.repository }}/masar-next
  LARAVEL_IMAGE: ghcr.io/${{ github.repository }}/masar-laravel

jobs:
  build:
    name: Build default Docker stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render default Compose config
        run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml config

      - name: Build Next image from default Compose
        id: next_image
        run: |
          docker compose --env-file infra/.env.example -f infra/docker-compose.yml build next
          # `config --images next` also lists next's dependency images (postgres,
          # redis, laravel, ...), breaking the single-line GITHUB_OUTPUT write.
          # `next` has no explicit `image:`, so Compose names the built image
          # `<project>-next` -- read the project name back from `config` instead
          # of hardcoding it.
          project="$(docker compose --env-file infra/.env.example -f infra/docker-compose.yml config --format json | jq -r '.name')"
          echo "tag=${project}-next" >> "${GITHUB_OUTPUT}"

      - name: Build Laravel worker image
        run: docker build -f archive-laravel/Dockerfile.worker -t masar-laravel:pr archive-laravel

      # V2-406: release.yml already scans at CRITICAL/--exit-code 1 before
      # publish, but that's the last gate before a tag ships -- nothing
      # caught fixable HIGH vulnerabilities earlier, at PR time, when
      # they're cheapest to fix. This mirrors that scan at HIGH,CRITICAL
      # on every PR instead.
      - name: Pull pinned Trivy scanner with retries
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if docker pull aquasec/trivy:0.65.0; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep "$((attempt * 10))"
            fi
          done
          exit 1

      - name: Scan Next image (fail on fixable high/critical vulnerabilities)
        shell: bash
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ runner.temp }}/trivy-cache:/root/.cache/trivy" \
            aquasec/trivy:0.65.0 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "${{ steps.next_image.outputs.tag }}"

      - name: Scan Laravel image (fail on fixable high/critical vulnerabilities)
        shell: bash
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ runner.temp }}/trivy-cache:/root/.cache/trivy" \
            aquasec/trivy:0.65.0 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            masar-laravel:pr

  publish:
    name: Publish images to GHCR (manual only — releases go through release.yml)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          echo "version=manual-${GITHUB_SHA::12}" >> "${GITHUB_OUTPUT}"

      - name: Build and push Next image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: archive-next/Dockerfile
          push: true
          tags: ${{ env.NEXT_IMAGE }}:${{ steps.meta.outputs.version }}
          build-args: |
            ARCHIVE_API_BASE_URL=http://laravel:8000/api/v1

      - name: Build and push Laravel image
        uses: docker/build-push-action@v6
        with:
          context: archive-laravel
          file: archive-laravel/Dockerfile.worker
          push: true
          tags: ${{ env.LARAVEL_IMAGE }}:${{ steps.meta.outputs.version }}
