name: Release

# Official releases: pushing a v* tag runs the FULL verification gate first,
# then publishes images and a GitHub Release. Nothing ships unverified.
# Every release publishes only its explicit version tag. Deployments consume
# the version + digest references attached in release-images.txt.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a running release

permissions: {}

env:
  NEXT_IMAGE: ghcr.io/${{ github.repository }}/masar-next
  LARAVEL_IMAGE: ghcr.io/${{ github.repository }}/masar-laravel

jobs:
  verify:
    name: Full release gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.5.0"
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Release gate (verify + security + readiness)
        run: pnpm run release:verify

  windows-native-build:
    name: Build Windows Native package
    runs-on: [self-hosted, windows, x64, archive-native-release]
    timeout-minutes: 60
    needs: verify
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.5.0"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Windows data-service inputs
        env:
          POSTGRES_URL: ${{ vars.WINDOWS_POSTGRES_URL }}
          POSTGRES_SHA256: ${{ vars.WINDOWS_POSTGRES_SHA256 }}
          PGVECTOR_URL: ${{ vars.WINDOWS_PGVECTOR_URL }}
          PGVECTOR_SHA256: ${{ vars.WINDOWS_PGVECTOR_SHA256 }}
        run: node scripts/fetch-native-release-inputs.mjs windows --out native-inputs
      - name: Build Windows Native package
        run: pnpm bundle:windows-native -- --out native-windows --postgres-installer native-inputs/postgresql-installer.exe --pgvector-dir native-inputs/pgvector
      - name: Verify and archive Windows Native package
        shell: powershell
        run: |
          node scripts/native-acceptance.mjs windows --bundle native-windows --verify-only --confirm-host-effects
          tar -czf "archive-suite-${env:GITHUB_REF_NAME}-windows-native.tar.gz" -C native-windows .
      - name: Upload Windows Native candidate
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-candidate
          path: archive-suite-${{ github.ref_name }}-windows-native.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows-native-acceptance:
    name: Accept Windows Native package on a clean host
    runs-on: [self-hosted, windows, x64, archive-native-release]
    timeout-minutes: 60
    needs: windows-native-build
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Windows Native candidate
        uses: actions/download-artifact@v4
        with:
          name: windows-native-candidate
      - name: Extract candidate
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force native-windows | Out-Null
          tar -xzf "archive-suite-${env:GITHUB_REF_NAME}-windows-native.tar.gz" -C native-windows
      - name: Run Windows Native acceptance
        shell: powershell
        run: node scripts/native-acceptance.mjs windows --bundle native-windows --confirm-host-effects --run-id "win-${env:GITHUB_RUN_ID}" --evidence-out native-evidence
      - name: Upload accepted Windows package and evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-release
          path: |
            archive-suite-${{ github.ref_name }}-windows-native.tar.gz
            native-evidence/
          if-no-files-found: error

  linux-native:
    name: Build and accept Linux Native package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: verify
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.5.0"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Linux Native package
        run: pnpm bundle:linux-native -- --out native-linux
      - name: Run Linux Native acceptance
        run: node scripts/native-acceptance.mjs linux --bundle native-linux --run-id "lnx-${GITHUB_RUN_ID}" --evidence-out native-evidence
      - name: Archive accepted Linux package
        run: tar -czf "archive-suite-${GITHUB_REF_NAME}-linux-native.tar.gz" -C native-linux .
      - name: Upload accepted Linux package and evidence
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-release
          path: |
            archive-suite-${{ github.ref_name }}-linux-native.tar.gz
            native-evidence/
          if-no-files-found: error

  whisper:
    name: Verify supported Whisper runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build canonical worker image
        run: docker build --tag archive-whisper-release --file archive-laravel/Dockerfile.worker archive-laravel
      - name: Run bounded Whisper release smoke
        run: node scripts/smoke-whisper-release.mjs --image archive-whisper-release --evidence whisper-evidence.json
      - name: Upload Whisper evidence
        uses: actions/upload-artifact@v4
        with:
          name: whisper-release-evidence
          path: whisper-evidence.json
          if-no-files-found: error

  publish:
    name: Publish images + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [verify, windows-native-acceptance, linux-native, whisper]
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.5.0"
          cache: pnpm

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:2.10.2

      - name: Install dependencies for license inventories
        run: |
          pnpm install --frozen-lockfile
          composer install --working-dir=archive-laravel --no-dev --no-interaction --no-scripts

      - name: Download verified distribution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-release*"
          path: native-release-assets
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Classify release
        id: meta
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          # Semver prerelease = anything with a dash (v1.0.0-rc.1, v2.0.0-beta.2)
          if [[ "${version}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      # sbom+provenance: BuildKit attaches SPDX SBOM and SLSA provenance
      # attestations to the pushed image (V1-205 supply chain).
      - name: Build and push Next image
        id: push_next
        uses: docker/build-push-action@v6
        with:
          context: .
          file: archive-next/Dockerfile
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ env.NEXT_IMAGE }}:${{ steps.meta.outputs.version }}
          build-args: |
            ARCHIVE_API_BASE_URL=http://laravel:8000/api/v1

      - name: Build and push Laravel image
        id: push_laravel
        uses: docker/build-push-action@v6
        with:
          context: archive-laravel
          file: archive-laravel/Dockerfile.worker
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ env.LARAVEL_IMAGE }}:${{ steps.meta.outputs.version }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign immutable image digests (keyless OIDC)
        shell: bash
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "${NEXT_IMAGE}@${{ steps.push_next.outputs.digest }}"
          cosign sign "${LARAVEL_IMAGE}@${{ steps.push_laravel.outputs.digest }}"

      - name: Verify keyless image signatures
        shell: bash
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify --certificate-identity "${identity}" --certificate-oidc-issuer "${issuer}" "${NEXT_IMAGE}@${{ steps.push_next.outputs.digest }}"
          cosign verify --certificate-identity "${identity}" --certificate-oidc-issuer "${issuer}" "${LARAVEL_IMAGE}@${{ steps.push_laravel.outputs.digest }}"

      # Air-gapped artifact is produced only from the two signature-verified
      # application digests plus the pinned core runtime images.
      - name: Build offline bundle
        shell: bash
        env:
          NEXT_IMAGE: "${{ env.NEXT_IMAGE }}@${{ steps.push_next.outputs.digest }}"
          LARAVEL_IMAGE: "${{ env.LARAVEL_IMAGE }}@${{ steps.push_laravel.outputs.digest }}"
        run: |
          # infra/docker-compose.yml is the source of truth for these pins (same
          # digests reproducibility/Kubernetes checks already enforce) --
          # infra/platform/release.v1.json is a different, Control-Center-only
          # descriptor and was never wired to real published images.
          export POSTGRES_IMAGE="$(grep -A1 '^  postgres:' infra/docker-compose.yml | grep 'image:' | awk '{print $2}')"
          export REDIS_IMAGE="$(grep -A1 '^  redis:' infra/docker-compose.yml | grep 'image:' | awk '{print $2}')"
          node scripts/offline-bundle.mjs build "${{ steps.meta.outputs.version }}" release-offline
          node scripts/offline-bundle.mjs verify "release-offline/archive-suite-offline-${{ steps.meta.outputs.version }}"
          node scripts/offline-bundle.mjs rehearse "release-offline/archive-suite-offline-${{ steps.meta.outputs.version }}" release-offline/v1-206-rehearsal-evidence.json
          node scripts/offline-bundle.mjs verify-evidence "release-offline/archive-suite-offline-${{ steps.meta.outputs.version }}" release-offline/v1-206-rehearsal-evidence.json

      - name: Export Next image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: "${{ env.NEXT_IMAGE }}@${{ steps.push_next.outputs.digest }}"
          format: spdx-json
          output-file: next-image.spdx.json
          upload-artifact: false

      - name: Export Laravel image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: "${{ env.LARAVEL_IMAGE }}@${{ steps.push_laravel.outputs.digest }}"
          format: spdx-json
          output-file: laravel-image.spdx.json
          upload-artifact: false

      - name: Generate and enforce dependency license inventories
        shell: bash
        run: |
          pnpm licenses list --prod --json > pnpm-licenses.json
          composer licenses --working-dir=archive-laravel --format=json --no-dev > composer-licenses.json
          node scripts/verify-release-licenses.mjs pnpm-licenses.json composer-licenses.json

      - name: Smoke Next image
        shell: bash
        run: |
          container_id="$(docker run --detach --publish 127.0.0.1::3000 "${NEXT_IMAGE}:${{ steps.meta.outputs.version }}")"
          trap 'docker rm --force "${container_id}"' EXIT
          port="$(docker port "${container_id}" 3000/tcp | sed 's/.*://')"
          for attempt in {1..30}; do
            curl --fail --silent --show-error "http://127.0.0.1:${port}/" >/dev/null && exit 0
            sleep 2
          done
          docker logs "${container_id}"
          exit 1

      - name: Smoke Laravel image
        shell: bash
        run: docker run --rm --env ARCHIVE_SECURE_COOKIES=true "${LARAVEL_IMAGE}:${{ steps.meta.outputs.version }}" php artisan --version

      - name: Pull pinned Trivy scanner with retries
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if docker pull aquasec/trivy:0.65.0; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep "$((attempt * 10))"
            fi
          done
          exit 1

      - name: Scan Next image (fail on fixable critical vulnerabilities)
        shell: bash
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ runner.temp }}/trivy-cache:/root/.cache/trivy" \
            aquasec/trivy:0.65.0 image \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "${NEXT_IMAGE}:${{ steps.meta.outputs.version }}"

      - name: Scan Laravel image (fail on fixable critical vulnerabilities)
        shell: bash
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ runner.temp }}/trivy-cache:/root/.cache/trivy" \
            aquasec/trivy:0.65.0 image \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "${LARAVEL_IMAGE}:${{ steps.meta.outputs.version }}"

      # Immutable reference manifest: deploy by digest, not by mutable tag.
      - name: Write image digests manifest
        shell: bash
        run: |
          cat > release-images.txt <<EOF
          # Masar ${GITHUB_REF_NAME} — immutable image references (deploy by digest)
          ${NEXT_IMAGE}:${{ steps.meta.outputs.version }}@${{ steps.push_next.outputs.digest }}
          ${LARAVEL_IMAGE}:${{ steps.meta.outputs.version }}@${{ steps.push_laravel.outputs.digest }}
          EOF
          cat release-images.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          offline_bundle="release-offline/archive-suite-offline-${{ steps.meta.outputs.version }}.tar.gz"
          offline_asset="$(basename "${offline_bundle}")"
          evidence_asset="v1-206-rehearsal-evidence.json"
          split -d -a 2 -b 1900M "${offline_bundle}" "${offline_asset}.part-"
          mapfile -t offline_parts < <(find . -maxdepth 1 -type f -name "${offline_asset}.part-*" -print | sort)
          sha256sum "${offline_bundle}" | sed "s#${offline_bundle}#${offline_asset}#" > OFFLINE-BUNDLE-SHA256
          printf '%s\n' \
            'حزمة Archive Suite غير المتصلة مقسمة لتوافق حد ملفات GitHub.' \
            "Linux/macOS: cat ${offline_asset}.part-* > ${offline_asset}" \
            "Windows CMD: copy /b ${offline_asset}.part-* ${offline_asset}" \
            'بعد التجميع تحقق من الملف: sha256sum --check OFFLINE-BUNDLE-SHA256' \
            > OFFLINE-BUNDLE-README.txt
          cp "release-offline/${evidence_asset}" "${evidence_asset}"
          mapfile -t native_assets < <(find native-release-assets -type f -print | sort)
          artifacts=(release-images.txt next-image.spdx.json laravel-image.spdx.json pnpm-licenses.json composer-licenses.json OFFLINE-BUNDLE-README.txt OFFLINE-BUNDLE-SHA256 "${offline_parts[@]}" "${evidence_asset}" "${native_assets[@]}")
          sha256sum "${artifacts[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
          flags=(--generate-notes --title "${GITHUB_REF_NAME}")
          [[ "${{ steps.meta.outputs.prerelease }}" == "true" ]] && flags+=(--prerelease)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${artifacts[@]}" SHA256SUMS --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${flags[@]}" "${artifacts[@]}" SHA256SUMS
          fi
