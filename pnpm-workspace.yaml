packages:
  - "archive-next"
allowBuilds:
  esbuild: true
  node: true
  sharp: true
# V2-407: nodemailer accumulated 6 overrides here, one per intermediate
# patch bump (each prior version turned out to have its own advisory before
# the next fix landed). Collapsed to the single rule that matters: anything
# older than the current safe version resolves straight to it. Old
# intermediate versions (7.0.7, 7.0.11, 8.0.4, 8.0.5, 8.0.8, 8.0.9) can no
# longer be resolved by any dependency, so their minimumReleaseAgeExclude
# entries were dead weight -- only the version actually installed needs one.
minimumReleaseAgeExclude:
  - '@hono/node-server@1.19.13'
  - postcss@8.5.10
  - esbuild@0.28.1
  - nodemailer@9.0.1
  - '@opentelemetry/core@2.8.0'
  - hono@4.12.25
  - undici@7.29.0
  - js-yaml@4.3.1
overrides:
  '@hono/node-server@<1.19.13': ^1.19.13
  '@opentelemetry/core@<2.8.0': ^2.8.0
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  hono@<4.12.25: ^4.12.25
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  nanoid@<3.3.17: ^3.3.17
  sharp@<0.35.0: ^0.35.0
  nodemailer@<9.0.1: ^9.0.1
  postcss@<8.5.10: ^8.5.10
  undici@<7.29.0: ^7.29.0
  brace-expansion@<2.1.4: ^2.1.4
